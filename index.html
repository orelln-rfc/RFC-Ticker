<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Ticker</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }

    .tradingview-widget-container {
      display: flex;
      flex-direction: column;          /* default: ticker on top, attribution below */
      /* flex-direction: column-reverse;   attribution ABOVE the ticker */
    }

    .tradingview-widget-copyright {
      font: 11px/1.4 Arial, sans-serif;
      padding: 2px 8px;
      text-align: right;               /* try: left | center | right */
      /* align-self: flex-end;            alternative way to push it right */
    }

    .tradingview-widget-copyright a { color: #2962ff; text-decoration: none; }
    .tradingview-widget-copyright .trademark { color: #787b86; }
  </style>
</head>
<body>
<!-- TradingView Widget BEGIN -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/markets/" rel="noopener nofollow" target="_blank"><span class="blue-text">Ticker tape</span></a><span class="trademark">&nbsp;by TradingView</span></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
  {
    "symbols": [
      { "proName": "SP:SPX", "title": "SPX" },
      { "proName": "IG:NASDAQ", "title": "NASDAQ" },
      { "proName": "BITSTAMP:BTCUSD", "title": "BTC" },
      { "proName": "NASDAQ:AAPL", "title": "AAPL" },
      { "proName": "OANDA:EURUSD", "title": "EURUSD" }
    ],
    "colorTheme": "light",
    "locale": "en",
    "largeChartUrl": "",
    "isTransparent": false,
    "showSymbolLogo": true,
    "displayMode": "adaptive"
  }
  </script>
</div>
<!-- TradingView Widget END -->
</body>
</html>
