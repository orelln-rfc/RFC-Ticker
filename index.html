<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Ticker</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    /* Layout: controls where the attribution sits relative to the ticker */
    .tradingview-widget-container {
      display: flex;
      flex-direction: column;            /* attribution below the ticker */
      /* flex-direction: column-reverse;    attribution above the ticker */
    }

    /* Attribution: moved by alignment, kept visible and readable */
    .tradingview-widget-copyright {
      display: inline-block;
      align-self: center;                /* flex-start = left, center, flex-end = right */
      margin: 4px 8px;
      padding: 2px 4px;
      background: none;
      font: 12px/1.4 Arial, sans-serif;
      text-align: center;
      color: #f6f6f6;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
    }

    /* Targets both the link and the inner span, since the span carries the blue */
    .tradingview-widget-copyright a,
    .tradingview-widget-copyright .blue-text {
      color: #f6f6f6 !important;         /* try #e6e8ee for a softer off-white */
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .tradingview-widget-copyright .trademark {
      color: #f6f6f6;
    }

    /* Optional, untested: tighten the empty space under the tape.
       [Guessing] this works, so confirm the ticker still renders fully. */
    /*
    .tradingview-widget-container__widget {
      height: 46px;
    }
    */
  </style>
</head>
<body>
<!-- TradingView Widget BEGIN -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/markets/" rel="noopener nofollow" target="_blank"><span class="blue-text">Ticker tape</span></a><span class="trademark">&nbsp;by TradingView</span></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
  {
    "symbols": [
      {
        "proName": "FOREXCOM:SPXUSD",
        "title": "SPX"
      },
      {
        "proName": "IG:NASDAQ",
        "title": "NASDAQ"
      },
      {
        "proName": "BITSTAMP:BTCUSD",
        "title": "BTC"
      },
      {
        "proName": "NASDAQ:AAPL",
        "title": "AAPL"
      },
      {
        "proName": "OANDA:EURUSD",
        "title": "EURUSD"
      }
    ],
    "colorTheme": "light",
    "locale": "en",
    "largeChartUrl": "",
    "isTransparent": false,
    "showSymbolLogo": true,
    "displayMode": "adaptive"
  }
  </script>
</div>
<!-- TradingView Widget END -->
</body>
</html>
